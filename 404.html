<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ไม่พบหน้านี้ | Zing Star Inspector</title>
<meta name="robots" content="noindex,follow">
<link rel="icon" href="img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&family=Cormorant+Garamond:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFDF8;--cream:#FAF3E3;--gold:#C8A24A;--gold-lt:#E8C86A;--gold-dk:#A97F2E;
  --yellow:#FFD84D;--brown:#6B4A21;--brown-dk:#4A3216;--ink:#2E2214;--muted:#8A7654;
  --line:rgba(169,127,46,.24);--shadow:0 18px 45px rgba(74,50,22,.10);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
/* the img carries width/height so the box is reserved while it loads;
   height:auto keeps it from being stretched to the attribute height */
img{max-width:100%;height:auto;display:block}
body{
  background:var(--cream);color:var(--ink);
  font-family:'Prompt',system-ui,sans-serif;font-weight:300;line-height:1.75;
  min-height:100vh;display:grid;place-items:center;padding:32px 20px;
  -webkit-font-smoothing:antialiased;
}
.card{
  width:min(560px,100%);text-align:center;background:var(--paper);
  border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);
  padding:48px 28px 40px;animation:in .6s var(--ease) both;
}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.logo{width:86px;margin:0 auto 22px;border-radius:16px}
.code{
  font-family:'Cormorant Garamond',serif;font-weight:700;font-size:4.6rem;line-height:1;
  background:linear-gradient(120deg,var(--gold-dk),var(--gold),var(--yellow));
  -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px;
}
h1{font-size:1.22rem;font-weight:600;color:var(--brown-dk);margin-bottom:10px}
p{font-size:.92rem;color:var(--muted);margin-bottom:26px}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{
  padding:13px 24px;border-radius:100px;font-size:.85rem;font-weight:500;
  letter-spacing:.02em;text-decoration:none;border:1px solid var(--line);
  color:var(--brown);background:var(--paper);transition:.35s var(--ease);
  display:inline-flex;align-items:center;gap:8px;min-height:46px;
}
.btn:hover{background:var(--yellow);border-color:var(--gold);color:var(--ink);transform:translateY(-2px)}
.btn-gold{
  background:linear-gradient(120deg,var(--gold-dk),var(--gold),var(--yellow));
  color:var(--ink);border-color:transparent;font-weight:600;
}
.btn-gold:hover{filter:brightness(1.05)}
a:focus-visible,button:focus-visible{outline:3px solid var(--gold-dk);outline-offset:3px}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-CSRMK1EQC5"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-CSRMK1EQC5');
</script>
</head>
<body>
  <main class="card">
    <img class="logo" src="img/logo.webp" alt="Zing Star Inspector" width="400" height="400">
    <div class="code">404</div>
    <h1>ไม่พบหน้าที่คุณกำลังหา</h1>
    <p>หน้านี้อาจถูกย้ายหรือลบไปแล้ว กลับไปหน้าแรกเพื่อดูบริการและค่าบริการทั้งหมดได้เลยครับ</p>
    <div class="acts">
      <a class="btn btn-gold" href="/">กลับหน้าแรก</a>
      <a class="btn" href="/#pricing">ดูค่าบริการ</a>
      <a class="btn" href="tel:0965415436">โทร 096 541 5436</a>
      <a class="btn" href="https://lin.ee/14aW2hy" target="_blank" rel="noopener">จองคิวผ่าน LINE</a>
    </div>
  </main>
<script>
/* หน้านี้เดิมไม่มีตัวนับเลย ถ้าโฆษณาหรือลิงก์เก่าพาคนมาที่ URL ที่ไม่มีอยู่
   จะไม่มีใครรู้ว่าจ่ายค่าคลิกไปกับหน้าเปล่า และไม่รู้ว่ามีคนกดโทรจากหน้านี้ */
window.addEventListener('load',function(){
  if(typeof gtag!=='function')return;
  gtag('event','page_not_found',{page_path:location.pathname+location.search,referrer:document.referrer||'direct'});
});
document.addEventListener('click',function(e){
  var a=e.target.closest?e.target.closest('a[href]'):null;
  if(!a||typeof gtag!=='function')return;
  var h=a.getAttribute('href')||'';
  var m=h.indexOf('tel:')===0?'phone':h.indexOf('lin.ee')>-1?'line':'';
  if(!m)return;
  gtag('event','contact_click',{method:m,section:'404'});
});
</script>
</body>
</html>
